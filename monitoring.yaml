AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch Monitoring and SNS Alerts

Parameters:

  NotificationEmail:
    Type: String
    Description: Email address to receive alerts

Resources:

# =====================================================
# SNS TOPIC
# =====================================================

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloudformation-lab-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref AlertTopic

# =====================================================
# EC2 / ASG CPU ALARM
# =====================================================

  ASGHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: ASG-High-CPU

      AlarmDescription: Auto Scaling Group CPU above 80%

      Namespace: AWS/EC2

      MetricName: CPUUtilization

      Statistic: Average

      Period: 300

      EvaluationPeriods: 2

      Threshold: 80

      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlertTopic

      Dimensions:
        - Name: AutoScalingGroupName
          Value:
            Fn::ImportValue: AutoScalingGroupName

# =====================================================
# RDS CPU ALARM
# =====================================================

  RDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: RDS-High-CPU

      Namespace: AWS/RDS

      MetricName: CPUUtilization

      Statistic: Average

      Period: 300

      EvaluationPeriods: 2

      Threshold: 80

      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlertTopic

      Dimensions:
        - Name: DBInstanceIdentifier
          Value: mysql-db

# =====================================================
# RDS FREE STORAGE
# =====================================================

  RDSLowStorageAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: RDS-Low-Storage

      Namespace: AWS/RDS

      MetricName: FreeStorageSpace

      Statistic: Average

      Period: 300

      EvaluationPeriods: 1

      Threshold: 2147483648

      ComparisonOperator: LessThanThreshold

      AlarmActions:
        - !Ref AlertTopic

      Dimensions:
        - Name: DBInstanceIdentifier
          Value: mysql-db

# =====================================================
# ALB 5XX ERRORS
# =====================================================

  ALB5XXAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: ALB-5XX-Errors

      Namespace: AWS/ApplicationELB

      MetricName: HTTPCode_ELB_5XX_Count

      Statistic: Sum

      Period: 300

      EvaluationPeriods: 1

      Threshold: 5

      ComparisonOperator: GreaterThanOrEqualToThreshold

      AlarmActions:
        - !Ref AlertTopic

      Dimensions:

        - Name: LoadBalancer
          Value:
            !Select
              - 1
              - !Split
                - "loadbalancer/"
                - !ImportValue ALBArn

# =====================================================
# ALB UNHEALTHY TARGETS
# =====================================================

  ALBUnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: ALB-Unhealthy-Hosts

      Namespace: AWS/ApplicationELB

      MetricName: UnHealthyHostCount

      Statistic: Average

      Period: 300

      EvaluationPeriods: 1

      Threshold: 1

      ComparisonOperator: GreaterThanOrEqualToThreshold

      AlarmActions:
        - !Ref AlertTopic

      Dimensions:

        - Name: TargetGroup
          Value:
            !Select
              - 1
              - !Split
                - "targetgroup/"
                - !ImportValue TargetGroupArn

# =====================================================
# HIGH NETWORK IN
# =====================================================

  HighNetworkInAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: High-Network-In

      Namespace: AWS/EC2

      MetricName: NetworkIn

      Statistic: Average

      Period: 300

      EvaluationPeriods: 2

      Threshold: 100000000

      ComparisonOperator: GreaterThanThreshold

      AlarmActions:
        - !Ref AlertTopic

Outputs:

  SNSTopicArn:
    Description: SNS Topic ARN
    Value: !Ref AlertTopic

  NotificationEmail:
    Description: Alert Email
    Value: !Ref NotificationEmail
