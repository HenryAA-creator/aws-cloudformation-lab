AWSTemplateFormatVersion: '2010-09-09'
Description: Compute Stack - ALB, Launch Template and Auto Scaling

Parameters:

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

# ====================================================
# TARGET GROUP
# ====================================================

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:

      Name: web-target-group

      Port: 80
      Protocol: HTTP

      VpcId:
        Fn::ImportValue: LabVPCId

      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /

      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

      Matcher:
        HttpCode: 200

# ====================================================
# APPLICATION LOAD BALANCER
# ====================================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:

      Name: web-alb

      Scheme: internet-facing

      Type: application

      SecurityGroups:
        - Fn::ImportValue: ALBSecurityGroupId

      Subnets:
        - Fn::ImportValue: PublicSubnetAZ1
        - Fn::ImportValue: PublicSubnetAZ2

# ====================================================
# LISTENER
# ====================================================

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener

    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer

      Port: 80

      Protocol: HTTP

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

# ====================================================
# IAM ROLE
# ====================================================

  EC2Role:
    Type: AWS::IAM::Role
    Properties:

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

# ====================================================
# LAUNCH TEMPLATE
# ====================================================

  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate

    Properties:

      LaunchTemplateName: web-launch-template

      LaunchTemplateData:

        ImageId: !Ref LatestAmiId

        InstanceType: t3.micro

        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn

        SecurityGroupIds:
          - Fn::ImportValue: EC2SecurityGroupId

        UserData:
          Fn::Base64: |
            #!/bin/bash

            dnf update -y

            dnf install -y httpd

            systemctl enable httpd
            systemctl start httpd

            echo "<h1>AWS CloudFormation Lab</h1>" > /var/www/html/index.html
            echo "<h2>Hosted by $(hostname)</h2>" >> /var/www/html/index.html

# ====================================================
# AUTO SCALING GROUP
# ====================================================

  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
